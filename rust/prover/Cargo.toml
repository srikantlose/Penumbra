[package]
name = "penumbra-prover"
version.workspace = true
authors.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Penumbra proof-number search prover"

[[bin]]
name = "penumbra-prove"
path = "src/main.rs"

[lib]
name = "penumbra_prover"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
shakmaty = "0.26"
shakmaty-syzygy = "0.24"
clap = { version = "4.4", features = ["derive"] }
zstd = "0.13"
ring = "0.17"
# Not for verification logic (the prover and verifier stay independent
# there) -- only for certificate_sha256, so a signed certificate is signed
# over exactly the same canonicalization the verifier will recompute later.
# Reimplementing that canonicalization a second time by hand would risk the
# two silently drifting apart, which would be a far worse bug than this
# dependency edge.
penumbra-verify = { path = "../verifier" }
